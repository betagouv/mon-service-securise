name: Préparer l'environnement Node.js
description: Installe pnpm, la version de Node.js du projet et les dépendances

runs:
  using: composite
  steps:
    - name: Installer pnpm
      shell: bash
      run: npm install -g "$(jq -r '.packageManager' package.json)"

    - name: Utiliser la version Node.js du projet
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Installer les dépendances
      shell: bash
      run: pnpm install
