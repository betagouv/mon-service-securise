name: L'intégration continue
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    name: Construction de MonServiceSécurisé

    runs-on: ubuntu-latest

    env:
      SECRET_COOKIE: secret

    steps:
      - name: Cloner le dépôt Git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Déterminer la version de Node.js à utiliser
        run: |
          echo "NODE_VERSION=$(./scripts/get-node-version.sh)" >> $GITHUB_ENV

      - name: Utiliser la version Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Installer les dépendances
        run: npm install -g "$(jq -r '.packageManager' package.json)" && pnpm install

      - name: Contrôler la mise en forme avec Prettier
        run: ./node_modules/.bin/prettier --check .

      - name: Contrôler la cohérence avec Eslint
        run: ./node_modules/.bin/eslint .

      - name: Contrôler la cohérence du Frontend avec Eslint
        run: ./node_modules/.bin/eslint -c svelte/eslint.config.js svelte

      - name: Contrôler le Typescript du Backend
        run: ./node_modules/.bin/tsc --noEmit

      - name: Contrôler la cohérence de Svelte avec `svelte-check`
        run: ./node_modules/.bin/svelte-check --workspace svelte --fail-on-warnings

      - name: Installer Miller (mlr) pour les tests des scripts du moteur de risques v2
        run: sudo apt-get update && sudo apt-get install -y miller

      - name: Exécuter les tests
        run: ./node_modules/.bin/vitest --reporter junit --outputFile=./test-report.xml

      - name: Rapport des tests
        uses: dorny/test-reporter@df6247429542221bc30d46a036ee47af1102c451 # v2.7.0
        if: ${{ !cancelled() }} # On force l'exécution même si l'étape précédente a échoué
        with:
          name: Tests
          path: ./test-report.xml
          reporter: jest-junit
