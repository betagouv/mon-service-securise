name: L'intégration continue
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  controles:
    name: Contrôler le code (Prettier, Eslint, Typescript, Svelte)

    runs-on: ubuntu-latest

    steps:
      - name: Cloner le dépôt Git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Préparer l'environnement Node.js
        uses: ./.github/actions/preparer-environnement-node

      - name: Exécuter les contrôles en parallèle
        run: >-
          pnpm exec concurrently --group
          --names prettier,eslint,eslint-svelte,tsc,svelte-check
          "prettier --check ."
          "eslint ."
          "eslint -c svelte/eslint.config.js svelte"
          "tsc --noEmit"
          "svelte-check --workspace svelte --fail-on-warnings"

  tests-unitaires:
    name: Exécuter les tests unitaires

    runs-on: ubuntu-latest

    env:
      SECRET_COOKIE: secret

    steps:
      - name: Cloner le dépôt Git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Préparer l'environnement Node.js
        uses: ./.github/actions/preparer-environnement-node

      - name: Installer Miller (mlr) pour les tests des scripts du moteur de risques v2
        env:
          MILLER_VERSION: 6.21.0
          MILLER_SHA256: 22daf43f3afc7c497da0b9480a0d4ef0d39c9bf68b2460068dd0187ed44f7b80
        run: |
          DOSSIER_MILLER="$RUNNER_TEMP/miller"
          ARCHIVE="$RUNNER_TEMP/miller.tar.gz"
          mkdir -p "$DOSSIER_MILLER"
          curl -fsSL -o "$ARCHIVE" "https://github.com/johnkerl/miller/releases/download/v${MILLER_VERSION}/miller-${MILLER_VERSION}-linux-amd64.tar.gz"
          echo "${MILLER_SHA256}  ${ARCHIVE}" | sha256sum --check --strict
          tar -xzf "$ARCHIVE" --strip-components=1 -C "$DOSSIER_MILLER" "miller-${MILLER_VERSION}-linux-amd64/mlr"
          echo "$DOSSIER_MILLER" >> "$GITHUB_PATH"

      - name: Exécuter les tests
        run: ./node_modules/.bin/vitest --reporter junit --outputFile=./test-report.xml

      - name: Rapport des tests
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: ${{ !cancelled() }} # On force l'exécution même si l'étape précédente a échoué
        with:
          name: Tests
          path: ./test-report.xml
          reporter: jest-junit

  integration:
    name: Vérifie que les scénarios vitaux de MSS fonctionnent

    runs-on: ubuntu-latest

    steps:
      - name: Cloner le dépôt Git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Préparer l'environnement Node.js
        uses: ./.github/actions/preparer-environnement-node

      - name: Déterminer la version de Playwright
        run: |
          echo "PLAYWRIGHT_VERSION=$(./node_modules/.bin/playwright --version | awk '{print $2}')" >> $GITHUB_ENV

      - name: Restaurer Chromium depuis le cache
        id: cache-chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ env.PLAYWRIGHT_VERSION }}

      - name: Installer Chromium pour Playwright
        if: steps.cache-chromium.outputs.cache-hit != 'true'
        run: ./node_modules/.bin/playwright install chromium

      - name: Exécuter les tests d'intégration
        run: pnpm test:integration

      - name: Publier le rapport Playwright en cas d'échec
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: rapport-playwright-integration
          path: test-results/
