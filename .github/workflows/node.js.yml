name: L'intégration continue
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  controles:
    name: ${{ matrix.controle.nom }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        controle:
          - nom: Contrôler la mise en forme avec Prettier
            commande: ./node_modules/.bin/prettier --check .
          - nom: Contrôler la cohérence avec Eslint
            commande: ./node_modules/.bin/eslint .
          - nom: Contrôler la cohérence du Frontend avec Eslint
            commande: ./node_modules/.bin/eslint -c svelte/eslint.config.js svelte
          - nom: Contrôler le Typescript du Backend
            commande: ./node_modules/.bin/tsc --noEmit
          - nom: Contrôler la cohérence de Svelte avec `svelte-check`
            commande: ./node_modules/.bin/svelte-check --workspace svelte --fail-on-warnings

    steps:
      - name: Cloner le dépôt Git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Préparer l'environnement Node.js
        uses: ./.github/actions/preparer-environnement-node

      - name: ${{ matrix.controle.nom }}
        run: ${{ matrix.controle.commande }}

  tests-unitaires:
    name: Exécuter les tests unitaires

    runs-on: ubuntu-latest

    env:
      SECRET_COOKIE: secret

    steps:
      - name: Cloner le dépôt Git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Préparer l'environnement Node.js
        uses: ./.github/actions/preparer-environnement-node

      - name: Installer Miller (mlr) pour les tests des scripts du moteur de risques v2
        run: sudo apt-get update && sudo apt-get install -y miller

      - name: Exécuter les tests
        run: ./node_modules/.bin/vitest --reporter junit --outputFile=./test-report.xml

      - name: Rapport des tests
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: ${{ !cancelled() }} # On force l'exécution même si l'étape précédente a échoué
        with:
          name: Tests
          path: ./test-report.xml
          reporter: jest-junit

  integration:
    name: Vérifie que les scénarios vitaux de MSS fonctionnent

    runs-on: ubuntu-latest

    steps:
      - name: Cloner le dépôt Git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Préparer l'environnement Node.js
        uses: ./.github/actions/preparer-environnement-node

      - name: Installer Chromium pour Playwright
        run: ./node_modules/.bin/playwright install chromium --with-deps

      - name: Exécuter les tests d'intégration
        run: pnpm test:integration

      - name: Publier le rapport Playwright en cas d'échec
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: rapport-playwright-integration
          path: test-results/
