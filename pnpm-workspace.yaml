# _c.f._ https://pnpm.io/settings

minimumReleaseAge: 10080 # 7 jours (exprimé en minutes)
preferFrozenLockfile: true

allowBuilds:
  bcrypt: true
  '@lab-anssi/lib': false
  '@parcel/watcher': false
  '@sentry/cli': false
  esbuild: false
  unrs-resolver: false
  puppeteer: false

minimumReleaseAgeExclude:
  - '@lab-anssi/ui-kit@1.60.9'
  - '@lab-anssi/lib@2.2.1'
  # Renovate security update: multer@2.3.0
  - multer@2.3.0
